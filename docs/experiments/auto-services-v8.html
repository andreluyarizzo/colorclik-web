<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><title>ColorClik — Servicios automáticos V8</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#15151b;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;overflow-x:hidden}button{font:inherit}a{color:inherit}.app{--accent:#ffcb00;--ink:#18171a;min-height:100svh;background:#fff;position:relative;overflow:hidden}.top{height:82px;max-width:1480px;margin:auto;padding:0 clamp(18px,4vw,66px);display:flex;align-items:center;justify-content:space-between;gap:15px;position:relative;z-index:5}.logo{font-size:27px;letter-spacing:-.085em;font-weight:900;text-decoration:none}.logo i{font-style:normal;color:#7748ff}.top .topnote{font-size:11px;letter-spacing:.12em;font-weight:750;text-transform:uppercase}.topnote span{display:inline-block;background:#15151b;color:#fff;border-radius:30px;padding:9px 14px}.stage{min-height:min(760px,calc(100svh - 82px));position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);align-items:center;padding:clamp(30px,6vw,85px) max(5vw,calc((100vw - 1350px)/2)) 160px;gap:2vw}.colorwash{position:absolute;inset:0;z-index:-2;background:var(--accent);transition:background .75s cubic-bezier(.22,1,.36,1)}.stage:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 77% 40%,#ffffff6e,transparent 38%),linear-gradient(110deg,#ffffff47 0%,transparent 60%);pointer-events:none}.stage:after{content:"COLORCLIK";position:absolute;z-index:-1;right:-3vw;top:11%;font-weight:900;font-size:clamp(95px,20vw,330px);letter-spacing:-.11em;color:#ffffff35;line-height:1;pointer-events:none;white-space:nowrap}.intro{position:relative;z-index:2;max-width:620px;align-self:center}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;display:flex;align-items:center;gap:12px}.eyebrow:before{content:"";width:28px;height:3px;background:currentColor;border-radius:3px}.intro h1{font-size:clamp(55px,7vw,118px);letter-spacing:-.085em;line-height:.92;margin:27px 0 24px;font-weight:900;max-width:700px}.intro p{font-size:clamp(15px,1.4vw,19px);line-height:1.65;max-width:400px;margin:0 0 35px}.explore{display:inline-flex;gap:12px;align-items:center;text-decoration:none;border-bottom:2px solid currentColor;padding:0 0 8px;font-size:15px;font-weight:800;transition:gap .25s}.explore:hover{gap:20px}.explore:focus-visible,.tab:focus-visible{outline:3px solid #17171c;outline-offset:5px}.visual{height:min(63vw,650px);min-height:350px;position:relative;display:grid;place-items:center;align-self:center;cursor:pointer;touch-action:pan-y}.halo{position:absolute;width:min(48vw,570px);aspect-ratio:1;border:1.5px solid #ffffff8a;border-radius:50%;box-shadow:0 0 0 50px #ffffff14,0 0 0 110px #ffffff0d;animation:orbit 12s ease-in-out infinite alternate}.halo:after{content:"";position:absolute;inset:12%;border:1px dashed #ffffff85;border-radius:50%;animation:spin 35s linear infinite}.visual img{position:relative;z-index:1;width:min(115%,670px);max-height:640px;object-fit:contain;filter:drop-shadow(0 30px 24px #15151b22);transform:translate3d(var(--mx,0px),var(--my,0px),0);transition:transform .25s ease-out;animation:float 5.5s ease-in-out infinite}.visual img.swap{animation:enter .7s cubic-bezier(.16,1,.3,1) both}.bottom{position:absolute;z-index:4;bottom:24px;left:5vw;right:5vw;display:flex;align-items:flex-end;gap:25px;justify-content:space-between}.tabs{display:flex;flex-wrap:wrap;gap:8px;max-width:850px}.tab{border:1px solid #17171b25;border-radius:100px;padding:12px 16px;background:#ffffff5c;color:#19191c;cursor:pointer;font-size:12px;font-weight:800;transition:background .3s,transform .3s,border-color .3s,box-shadow .3s}.tab:hover{transform:translateY(-3px);background:#ffffffa8}.tab[aria-selected=true]{background:#17171c;color:#fff;border-color:#17171c;box-shadow:0 7px 20px #17171c26}.counter{font-size:12px;font-weight:850;white-space:nowrap;letter-spacing:.09em}.progress{position:absolute;bottom:0;left:0;height:5px;background:#17171c;width:20%;transition:transform .7s cubic-bezier(.16,1,.3,1)}.animate-in .intro>*{animation:text-in .7s cubic-bezier(.16,1,.3,1) both}.animate-in .intro>*:nth-child(2){animation-delay:.08s}.animate-in .intro>*:nth-child(3){animation-delay:.14s}.animate-in .intro>*:nth-child(4){animation-delay:.2s}@keyframes float{0%,100%{transform:translate3d(var(--mx,0px),var(--my,0px),0)}50%{transform:translate3d(var(--mx,0px),calc(var(--my,0px) - 12px),0)}}@keyframes enter{from{opacity:0;transform:translate3d(35px,20px,0) scale(.92)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}@keyframes text-in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes orbit{to{transform:translateY(-18px) rotate(8deg)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){.stage{grid-template-columns:1fr;gap:0;min-height:calc(100svh - 72px);padding:42px 24px 150px}.top{height:72px;padding:0 24px}.intro{align-self:start}.intro h1{font-size:clamp(52px,11vw,86px);max-width:650px;margin:17px 0 14px}.intro p{font-size:14px;max-width:480px;margin-bottom:18px}.visual{min-height:280px;height:clamp(300px,52vw,480px);margin-top:-15px}.visual img{max-height:450px}.halo{width:min(70vw,400px)}.bottom{left:24px;right:24px;bottom:18px;display:block}.tabs{gap:7px}.tab{font-size:11px;padding:11px 13px}.counter{display:none}.stage:after{top:30%;font-size:25vw}}@media(max-width:480px){.top .topnote{font-size:9px}.topnote span{padding:8px 10px}.stage{padding:30px 17px 170px}.intro h1{font-size:clamp(46px,13.8vw,66px)}.intro p{font-size:13px;line-height:1.5}.visual{min-height:260px;height:36svh;margin-top:-2px}.visual img{max-height:350px;width:120%}.halo{width:78vw}.bottom{left:17px;right:17px;bottom:19px}.tab{font-size:10px;padding:11px 12px}.tabs{gap:7px}.eyebrow{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.visual img{transform:none!important}}

/* V8: compact, automatically paced version of the original V5. */
.stage{min-height:550px;height:550px;padding:35px max(5vw,calc((100vw - 1350px)/2)) 100px}
.intro h1{font-size:clamp(52px,6.2vw,86px);margin:18px 0}
.intro p{margin-bottom:22px}
.visual{height:390px;min-height:0;cursor:default}
.visual img{position:absolute;max-width:100%;width:480px;height:390px;animation:none;transition:opacity .65s ease,transform .65s ease}
.visual img.inactive{opacity:0;transform:translateY(12px) scale(.97)}
.halo{width:min(36vw,390px);animation:none}
.halo:after{animation:none}
.intro{transition:opacity .22s ease,transform .22s ease}
.intro.leaving{opacity:0;transform:translateY(8px)}
.bottom{align-items:center;bottom:24px}
.progress{width:100%;height:2px;transform:scaleX(0);transform-origin:left;transition:none;opacity:.5}
.playback{border:1px solid #17171b55;border-radius:100px;background:#ffffff80;padding:10px 14px;min-height:44px;font:inherit;font-size:12px;cursor:pointer}
.playback:focus-visible{outline:3px solid #17171c;outline-offset:4px}
.tab{min-height:44px}
@media(max-width:850px){.stage{height:auto;min-height:550px;padding:32px 24px 24px;grid-template-columns:1fr}.intro h1{font-size:clamp(48px,9vw,72px)}.visual{height:300px;margin-top:4px}.visual img{height:300px;width:min(100%,420px)}.halo{width:min(65vw,300px)}.bottom{position:relative;inset:auto;display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}.tabs{flex:1 1 100%}.stage:after{top:36%}}
@media(max-width:480px){.stage{padding:28px 17px 22px}.intro h1{font-size:clamp(43px,12vw,60px)}.visual{height:260px;min-height:0}.visual img{height:260px;width:100%}.tab{padding:10px 12px}.bottom{margin-top:8px}.counter{display:block}}
</style></head><body>
<div class="app" id="app"><nav class="top"><a class="logo" href="../index.html" aria-label="ColorClik inicio">Color<i>Clik</i>.</a><div class="topnote"><span>Servicios / V8</span></div></nav>
<main class="stage" id="stage"><div class="colorwash"></div><section class="intro" id="service-panel" role="tabpanel" aria-labelledby="service-tab-0"><span class="eyebrow" id="eyebrow">01 / Creamos conexiones</span><h1 id="heading">Marketing<br>Digital.</h1><p id="description">Ideas que conectan con personas y hacen crecer tu marca.</p><a class="explore" id="explore" href="../marketing-digital.html">Explorar servicio <span aria-hidden="true">↗</span></a></section><div class="visual" id="visual" aria-label="Personaje del servicio seleccionado"><div class="halo" aria-hidden="true"></div><img id="character" src="../assets/marketing/hero.webp" alt="Personaje de Marketing Digital"></div>
<div class="bottom"><div class="tabs" role="tablist" aria-label="Explora los servicios"><button class="tab" type="button" role="tab" aria-selected="true" data-index="0">Marketing</button><button class="tab" type="button" role="tab" aria-selected="false" data-index="1">Desarrollo Web</button><button class="tab" type="button" role="tab" aria-selected="false" data-index="2">Branding</button><button class="tab" type="button" role="tab" aria-selected="false" data-index="3">Redes</button><button class="tab" type="button" role="tab" aria-selected="false" data-index="4">A medida</button></div><button class="playback" id="playback" type="button" aria-pressed="false">Pausar</button><span class="counter" id="counter">01 — 05</span></div><div class="progress" id="progress" aria-hidden="true"></div></main></div>
<script>
(()=>{'use strict';const services=[
{title:'Marketing<br>Digital.',description:'Ideas que conectan con personas y hacen crecer tu marca.',eyebrow:'01 / Creamos conexiones',accent:'#ffcb00',image:'../assets/marketing/hero.webp',url:'../marketing-digital.html',alt:'Personaje de Marketing Digital'},
{title:'Desarrollo<br>Web.',description:'Sitios web que enamoran, funcionan y convierten tus ideas en experiencias.',eyebrow:'02 / Experiencias digitales',accent:'#1283ff',image:'../assets/web/hero.webp',url:'../desarrollo-web.html',alt:'Personaje de Desarrollo Web'},
{title:'Branding<br>y Diseño.',description:'Identidades visuales con personalidad que hacen que tu marca destaque.',eyebrow:'03 / Marcas inolvidables',accent:'#ff3568',image:'../assets/branding/hero.webp',url:'../branding-diseno.html',alt:'Personaje de Branding y Diseño'},
{title:'Redes y<br>Contenido.',description:'Contenido creativo que despierta conversaciones y construye comunidad.',eyebrow:'04 / Contenido con vida',accent:'#00c9ae',image:'../assets/social/hero.webp',url:'../redes-contenido.html',alt:'Personaje de Redes y Contenido'},
{title:'Soluciones<br>a Medida.',description:'Tecnología creada para tus ideas, sin límites ni plantillas.',eyebrow:'05 / Sin límites',accent:'#7748ff',image:'../assets/custom/hero.webp',url:'../soluciones-medida.html',alt:'Personaje de Soluciones a Medida'}];

const app=document.querySelector('#app'),stage=document.querySelector('#stage'),panel=document.querySelector('.intro'),heading=document.querySelector('#heading'),description=document.querySelector('#description'),eyebrow=document.querySelector('#eyebrow'),explore=document.querySelector('#explore'),visual=document.querySelector('#visual'),counter=document.querySelector('#counter'),progress=document.querySelector('#progress'),playback=document.querySelector('#playback'),tabs=[...document.querySelectorAll('.tab')];
const reduce=matchMedia('(prefers-reduced-motion: reduce)'),duration=5000;
let current=0,elapsed=0,last=null,hover=false,focused=false,manualPause=false,swapTimer;
const images=services.map((s,i)=>{const img=i===0?document.querySelector('#character'):new Image();img.src=s.image;img.alt=i===0?s.alt:'';img.classList.toggle('inactive',i!==0);img.setAttribute('aria-hidden',String(i!==0));if(i)visual.append(img);return img});
tabs.forEach((tab,i)=>{tab.id='service-tab-'+i;tab.setAttribute('aria-controls','service-panel');tab.tabIndex=i===0?0:-1});
function paused(){return hover||focused||manualPause||reduce.matches||document.hidden}
function updatePlayback(){playback.textContent=manualPause?'Reanudar':'Pausar';playback.setAttribute('aria-pressed',String(manualPause));playback.hidden=reduce.matches}
function render(n){const s=services[n];heading.innerHTML=s.title;description.textContent=s.description;eyebrow.textContent=s.eyebrow;explore.href=s.url;panel.classList.remove('leaving')}
function select(n){n=(n+services.length)%services.length;elapsed=0;progress.style.transform='scaleX(0)';if(n===current)return;current=n;clearTimeout(swapTimer);app.style.setProperty('--accent',services[n].accent);images.forEach((img,i)=>{img.classList.toggle('inactive',i!==n);img.alt=i===n?services[n].alt:'';img.setAttribute('aria-hidden',String(i!==n))});counter.textContent=String(n+1).padStart(2,'0')+' — 05';tabs.forEach((tab,i)=>{tab.setAttribute('aria-selected',String(i===n));tab.tabIndex=i===n?0:-1});panel.setAttribute('aria-labelledby',tabs[n].id);if(reduce.matches)render(n);else{panel.classList.add('leaving');swapTimer=setTimeout(()=>render(n),220)}}
tabs.forEach((tab,i)=>{tab.addEventListener('click',()=>select(i));tab.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=i+1;else if(e.key==='ArrowLeft')n=i-1;else if(e.key==='Home')n=0;else if(e.key==='End')n=4;else return;e.preventDefault();n=(n+5)%5;select(n);tabs[n].focus()})});
stage.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=true});
stage.addEventListener('pointerleave',()=>{hover=false});
stage.addEventListener('focusin',()=>{focused=true});
stage.addEventListener('focusout',e=>{focused=stage.contains(e.relatedTarget)});
playback.addEventListener('click',()=>{manualPause=!manualPause;updatePlayback()});
reduce.addEventListener('change',()=>{clearTimeout(swapTimer);render(current);elapsed=0;progress.style.transform='scaleX(0)';updatePlayback()});
document.addEventListener('visibilitychange',()=>{last=null});
function tick(now){if(last!==null&&!paused()){elapsed+=Math.min(now-last,100);if(elapsed>=duration)select(current+1)}last=now;progress.style.transform='scaleX('+(elapsed/duration)+')';requestAnimationFrame(tick)}
updatePlayback();requestAnimationFrame(tick);
})();</script></body></html>
